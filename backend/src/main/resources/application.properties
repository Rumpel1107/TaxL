# Filled by Maven at build time from the project version, which the Dockerfile sets to the git tag.
taxl.version=@project.version@

# The database is the `db` service of compose.yml (D59). socketTimeout bounds every read on an
# open connection and connectTimeout every attempt to open one, in seconds: a database that is
# alive but not answering cannot hang the API (slice-2 review).
spring.datasource.url=jdbc:postgresql://db:5432/taxl?socketTimeout=2&connectTimeout=2
spring.datasource.username=taxl
# The password is a file mounted by Compose under /run/secrets/; every file there becomes a
# property named after it. It is never an environment variable or an argument (method: secrets).
# No default on purpose: without the secret the API refuses to start and says why (principle 6).
spring.config.import=optional:configtree:/run/secrets/
spring.datasource.password=${db_password}

# The API starts whether or not the database answers, and says which in /api/status. Every wait
# is bounded — pool slot, validation of a pooled connection, socket read, query — so a hung
# database costs seconds, not threads (slice-2 review; measured live with the database paused).
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
# Each pooled connection is validated in turn when the database hangs, so the pool size is also
# the worst-case wait. Two is enough for a status endpoint; the engine resizes it with a measurement.
spring.datasource.hikari.maximum-pool-size=2
