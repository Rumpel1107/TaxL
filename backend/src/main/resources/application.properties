# Filled by Maven at build time from the project version, which the Dockerfile sets to the git tag.
taxl.version=@project.version@

# The database is the `db` service of compose.yml (D59).
spring.datasource.url=jdbc:postgresql://db:5432/taxl
spring.datasource.username=taxl
# The password is a file mounted by Compose under /run/secrets/; every file there becomes a
# property named after it. It is never an environment variable or an argument (method: secrets).
spring.config.import=optional:configtree:/run/secrets/
spring.datasource.password=${db_password:}

# The API starts whether or not the database answers, and says which in /api/status.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=2000
